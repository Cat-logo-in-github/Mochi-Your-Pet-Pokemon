name: Release Mochi

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build native companion and run native self-tests
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: mochi-release-windows
          path: dist/mochi-windows-companion.zip
          if-no-files-found: error
  project-and-browser:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: mochi-release-windows
          path: dist
      - run: npm ci --workspaces=false
      - run: npm run validate:assets
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          MOCHI_REPOSITORY: ${{ github.repository }}
      - run: npm run package
      - run: npm run verify:release
      - uses: actions/upload-artifact@v7
        with:
          name: mochi-release-project-and-browser
          path: |
            dist/mochi-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: [project-and-browser, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: mochi-release-*
          path: release
          merge-multiple: true
      - name: Generate checksums for the actual release files
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish a release without replacing binaries from a different source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          source_sha=$(git rev-parse HEAD)
          base_tag="v$version"
          tag_commit() {
            local object object_type object_sha
            local error_file="$RUNNER_TEMP/mochi-tag-check.txt"
            if ! object=$(gh api "repos/$GH_REPO/git/ref/tags/$1" --jq '.object.type + " " + .object.sha' 2>"$error_file"); then
              if [[ "$(<"$error_file")" == *"HTTP 404"* ]]; then return 0; fi
              cat "$error_file" >&2
              return 1
            fi
            read -r object_type object_sha <<< "$object"
            for depth in {1..8}; do
              if [[ "$object_type" == commit ]]; then printf '%s' "$object_sha"; return 0; fi
              if [[ "$object_type" != tag ]]; then echo "Unexpected tag object type" >&2; return 1; fi
              object=$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq '.object.type + " " + .object.sha')
              read -r object_type object_sha <<< "$object"
            done
            echo "Tag annotation depth exceeded" >&2
            return 1
          }
          existing_sha=$(tag_commit "$base_tag")
          release_tag=$(node .github/scripts/release-tag.mjs "$version" "$source_sha" "$existing_sha" "$GITHUB_RUN_NUMBER")
          if [[ "$release_tag" != "$base_tag" ]]; then existing_sha=$(tag_commit "$release_tag"); fi
          if [[ -n "$existing_sha" && "$existing_sha" != "$source_sha" ]]; then
            echo "Refusing to overwrite a tag for another source commit." >&2
            exit 1
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            if [[ -z "$existing_sha" ]]; then echo "Release has no verified tag" >&2; exit 1; fi
            gh release upload "$release_tag" release/*.zip release/SHA256SUMS.txt --clobber
            gh release edit "$release_tag" --latest
          else
            gh release create "$release_tag" release/*.zip release/SHA256SUMS.txt --target "$source_sha" --title "Mochi $version" --generate-notes --latest
          fi
          echo "Published runnable downloads: https://github.com/$GH_REPO/releases/latest" >> "$GITHUB_STEP_SUMMARY"
