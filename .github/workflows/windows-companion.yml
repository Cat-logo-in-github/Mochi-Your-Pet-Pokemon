name: Build Windows companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/windows-companion/**'
      - 'packages/pet-assets/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows-companion.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'apps/windows-companion/**'
      - 'packages/pet-assets/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows-companion.yml'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  windows-companion:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile, run native self-tests, and package
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: mochi-windows-companion
          path: dist/mochi-windows-companion.zip
          if-no-files-found: error
          retention-days: 14
